<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FoodBanner</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <div class="image_container">
        <img src="./bg.png" alt="bg image" />
      </div>
      <div class="content">
        <img src="./burger.png" alt="burger" class="burger" />
        <img src="./leaf.png" alt="leaf" class="leaf" />
        <img src="./left tomato.png" alt="tomato" class="tomato1" />
        <img src="./momo.png" alt="momo" class="momo" />
        <img src="./pizza .png" alt="pizza" class="pizza" />
        <img src="./right tomato.png" alt="tomato" class="tomato2" />
        <div class="center-content">
          <section class="text-content">
            <h1>
              Better food <br />
              for more people <br />
            </h1>
            <p>
              For over a decade, we’ve enabled our<br /> customers to
              discover new tastes,<br /> delivered right to their doorstep
            </p>
          </section>
          <section class="info-content">
            <div class="info-item">
              <img src="./house.png" alt="restaurent-icon" class="info-icon" />
            </div>
            <div class="info-text">
              <span class="info-number"> 3,00,000+</span>
              <span class="info-lable">Restaurant</span>
            </div>

            <div class="info-item">
              <img src="./pointer.png" alt="location-icon" class="info-icon" />
            </div>
            <div class="info-text">
              <span class="info-number"> 800+</span>
              <span class="info-lable">Cities</span>
            </div>

            <div class="info-item" >
              <img src="./sale.png" alt="sale-icon" class="info-icon"  />
            </div>
            <div class="info-text">
              <span class="info-number">3 billion+</span>
              <span class="info-lable">Orders</span>
            </div>

          </section>
        </div>
      </div>
    </main>
  </body>
</html>
